<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Camp Mayagay</title>

<link rel="stylesheet" href="assets/css/style.css?v=7">
</head>
<body>
      <img src="assets/images/Background.png" alt="" class="bg-image">
       <div class="bg-overlay"></div>
       
  <main class="auth-main">
    <div class="auth-card">
      <h1>Sign Up</h1>
      <p class="subtitle">Create your Camp Mayagay guest account</p>

      <div class="form-alert" id="registerAlert" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group two-col">
          <div class="field">
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname" placeholder="First name" autocomplete="given-name">
            <span class="field-error" id="firstnameError"></span>
          </div>
          <div class="field">
            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="lastname" placeholder="Last name" autocomplete="family-name">
            <span class="field-error" id="lastnameError"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="email-verify-row">
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
            <button type="button" class="btn-verify-email" id="verifyEmailBtn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
              <span id="verifyEmailBtnText">Verify</span>
            </button>
          </div>
          <span class="verify-status is-unverified" id="emailVerifyStatus" role="status">Email not verified</span>
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username">
          <span class="field-error" id="usernameError"></span>
        </div>

        <div class="form-group">
          <label for="contact_number">Contact Number</label>
          <div class="phone-row"><select id="contact_country" aria-label="Country code"><option value="PH" data-dial="63">🇵🇭 PH +63</option><option value="US" data-dial="1">🇺🇸 US +1</option><option value="GB" data-dial="44">🇬🇧 GB +44</option><option value="AU" data-dial="61">🇦🇺 AU +61</option><option value="NZ" data-dial="64">🇳🇿 NZ +64</option><option value="SG" data-dial="65">🇸🇬 SG +65</option><option value="MY" data-dial="60">🇲🇾 MY +60</option><option value="ID" data-dial="62">🇮🇩 ID +62</option><option value="TH" data-dial="66">🇹🇭 TH +66</option><option value="VN" data-dial="84">🇻🇳 VN +84</option><option value="JP" data-dial="81">🇯🇵 JP +81</option><option value="KR" data-dial="82">🇰🇷 KR +82</option><option value="CN" data-dial="86">🇨🇳 CN +86</option><option value="HK" data-dial="852">🇭🇰 HK +852</option><option value="TW" data-dial="886">🇹🇼 TW +886</option><option value="IN" data-dial="91">🇮🇳 IN +91</option><option value="AE" data-dial="971">🇦🇪 AE +971</option><option value="SA" data-dial="966">🇸🇦 SA +966</option><option value="QA" data-dial="974">🇶🇦 QA +974</option><option value="KW" data-dial="965">🇰🇼 KW +965</option><option value="IT" data-dial="39">🇮🇹 IT +39</option><option value="DE" data-dial="49">🇩🇪 DE +49</option><option value="FR" data-dial="33">🇫🇷 FR +33</option><option value="ES" data-dial="34">🇪🇸 ES +34</option></select><input type="tel" id="contact_number" name="contact_number" placeholder="09XXXXXXXXX" inputmode="numeric" maxlength="11" autocomplete="tel"></div>
          <span class="field-error" id="contact_numberError"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="confirm_password" aria-label="Show password">Show</button>
          </div>
          <span class="field-error" id="confirm_passwordError"></span>
        </div>

        <div class="form-group consent-group">
          <label class="consent-label" for="consent">
            <input type="checkbox" id="consent" name="consent">
            <span>I agree to the Terms and Conditions and allow Camp Mayagay to collect and use my personal information (name, email and contact number) for my account and bookings.</span>
          </label>
          <span class="field-error" id="consentError"></span>
        </div>

        <button type="submit" class="btn-primary" id="registerSubmitBtn" disabled>Sign Up</button>
        <p class="verify-hint" id="verifyHint">Verify your email to enable Sign Up.</p>
      </form>

      <p class="auth-switch">Already have an account? <a href="index.html">Login</a></p>
    </div>
  </main>

  <!-- Popup shown after the guest presses Verify -->
  <div class="verify-modal" id="verifyModal" hidden role="dialog" aria-modal="true" aria-labelledby="verifyModalTitle">
    <div class="verify-modal-card">
      <button type="button" class="verify-modal-close" id="verifyModalClose" aria-label="Close">&times;</button>
      <div class="verify-modal-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
      </div>
      <h2 id="verifyModalTitle">Check your email</h2>
      <p class="verify-modal-text">We sent an email to <strong id="verifyModalEmail"></strong>. Open it and tap <strong>Verify my email</strong>.</p>

      <div class="verify-waiting" id="verifyWaiting" role="status">
        <span class="verify-spinner" aria-hidden="true"></span>
        <span>Waiting for you to verify&hellip;</span>
      </div>
      <span class="field-error verify-modal-error" id="verifyModalError" role="alert"></span>

      <button type="button" class="verify-alt-toggle" id="verifyCodeToggle">Link not opening? Enter the code instead</button>
      <div class="verify-code-row" id="verifyCodeRow" hidden>
        <input type="text" id="verifyCodeInput" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" aria-label="6-digit code from the email">
        <button type="button" class="btn-verify-email" id="verifyCodeBtn">Confirm</button>
      </div>

      <p class="verify-modal-resend">
        Didn't get it? Check your spam folder or
        <button type="button" class="resend-code-btn" id="resendEmailCodeBtn" disabled>resend email <span id="resendEmailTimer"></span></button>
      </p>
    </div>
  </div>

<script src="assets/js/script.js?v=12"></script>
</body>
</html>
