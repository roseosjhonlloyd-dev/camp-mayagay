<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Camp Mayagay</title>

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
      <img src="assets/images/Background.png" alt="" class="bg-image">
       <div class="bg-overlay"></div>
       
  <main class="auth-main">
    <div class="auth-card">
      <h1>Sign Up</h1>
      <p class="subtitle">Create your Camp Mayagay guest account</p>

      <div class="form-alert" id="registerAlert" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group two-col">
          <div class="field">
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname" placeholder="First name" autocomplete="given-name">
            <span class="field-error" id="firstnameError"></span>
          </div>
          <div class="field">
            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="lastname" placeholder="Last name" autocomplete="family-name">
            <span class="field-error" id="lastnameError"></span>
          </div>
        </div>

        <div class="form-group">  
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username">
          <span class="field-error" id="usernameError"></span>
        </div>

        <div class="form-group">
          <label for="contact_number">Contact Number</label>
          <input type="tel" id="contact_number" name="contact_number" placeholder="09XXXXXXXXX" autocomplete="tel">
          <span class="field-error" id="contact_numberError"></span>
        </div>

        <div class="form-group">
          <label for="valid_id">Valid ID</label>
          <div class="id-upload-card">
            <div class="id-upload-preview" id="idUploadPreview">
              <svg viewBox="0 0 24 24" fill="none" width="24" height="24"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10.5" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M6 16c.5-1.8 1.9-2.8 3.5-2.8s3 1 3.5 2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M14 9h5M14 12h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </div>
            <div class="id-upload-body">
              <label class="id-upload-btn" for="valid_id">
                <svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                Choose photo
              </label>
              <input type="file" id="valid_id" name="valid_id" accept="image/jpeg,image/png" class="id-upload-input">
              <span class="id-upload-filename" id="idUploadFilename"></span>
              <p class="id-upload-hint">JPEG or PNG, up to 5MB. Government-issued ID (driver's license, UMID, passport, etc.)</p>
            </div>
          </div>
          <span class="field-error" id="valid_idError"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="confirm_password" aria-label="Show password">Show</button>
          </div>
          <span class="field-error" id="confirm_passwordError"></span>
        </div>

        <button type="submit" class="btn-primary">Sign Up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="Login.html">Login</a></p>
    </div>
  </main>

<script src="assets/js/script.js?v=3"></script>
</body>
</html>
