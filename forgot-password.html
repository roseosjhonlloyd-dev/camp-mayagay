<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Camp Mayagay</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/forgot-password.css">
</head>
<body>

    <img src="assets/images/Background.png" alt="" class="bg-image">
    <div class="bg-overlay"></div> 
    <main class="fp-main">
    <div class="fp-outer-card">
      <h1 class="fp-page-title">Forgot Password</h1>
      <div class="fp-inner-card">

        <div class="fp-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
        </div>

        <p class="fp-card-title">Reset your password</p>
        <p class="fp-card-subtitle">Enter your registered email address to receive a verification code.</p>
        <form id="forgotForm" novalidate>
          <input type="email" id="forgotEmail" name="forgotEmail" class="fp-input" placeholder="Enter your email address" autocomplete="email">
          <span class="fp-field-error" id="forgotEmailError"></span>

          <button type="submit" class="fp-btn-primary">Send Verification Code</button>
        </form>

        <div class="fp-divider">OR</div>
        <a href="Login.html" class="fp-back-link">Back to Login</a>

      </div>
    </div>
  </main>

  <script>
    var forgotForm = document.getElementById('forgotForm');
    var forgotEmailInput = document.getElementById('forgotEmail');
    var forgotEmailError = document.getElementById('forgotEmailError');
    var forgotSubmitBtn = forgotForm.querySelector('button[type="submit"]');

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    forgotForm.addEventListener('submit', function (e) {
      e.preventDefault();
      forgotEmailError.textContent = '';

      var email = forgotEmailInput.value.trim();
      if (email === '' || !isValidEmail(email)) {
        forgotEmailError.textContent = 'Enter a valid email address.';
        return;
      }

      forgotSubmitBtn.disabled = true;
      var originalText = forgotSubmitBtn.textContent;
      forgotSubmitBtn.textContent = 'Sending...';

      fetch('php/forgot-password.php?action=send_code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ email: email })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.success) {
            // Remember the email so verify_code.html can show it and the
            // guest doesn't have to retype it anywhere.
            sessionStorage.setItem('resetEmail', email);
            window.location.href = 'verify_code.html';
          } else {
            forgotEmailError.textContent = result.message || 'Could not send the code. Please try again.';
          }
        })
        .catch(function () {
          forgotEmailError.textContent = 'Unable to reach the server. Please try again.';
        })
        .finally(function () {
          forgotSubmitBtn.disabled = false;
          forgotSubmitBtn.textContent = originalText;
        });
    });
  </script>

</body>
</html>
