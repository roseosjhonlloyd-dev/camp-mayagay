<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create New Password | Camp Mayagay</title>


<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/forgot-password.css">
</head>
<body>

    <img src="assets/images/Background.png" alt="" class="bg-image">
    <div class="bg-overlay"></div>
    <main class="fp-main">
    <div class="fp-outer-card">
      <h1 class="fp-page-title">Account Recovery</h1>
      <div class="fp-inner-card">
        <div class="fp-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="5" y="10" width="14" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 018 0v3"/>
          </svg>
        </div>
        <p class="fp-card-title">Create New Password</p>
        <p class="fp-card-subtitle">Create your new password.</p>
        <form id="resetForm" novalidate>
          <div class="fp-input-wrap">
            <input type="password" id="newPassword" class="fp-input" placeholder="New Password" autocomplete="new-password">
            <button type="button" class="fp-eye-btn" data-target="newPassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
          <div class="fp-input-wrap">
            <input type="password" id="confirmPassword" class="fp-input" placeholder="Confirm New Password" autocomplete="new-password">
            <button type="button" class="fp-eye-btn" data-target="confirmPassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
          <span class="fp-field-error" id="resetPasswordError"></span>

          <button type="submit" class="fp-btn-primary" id="submitBtn">Change Password</button>
        </form>

        <div class="fp-success-box" id="successBox">
          <div class="fp-success-icon">&#10003;</div>
          <div>
            <p class="fp-success-title">Password Reset Successfully!</p>
            <p class="fp-success-text">You can now login using your new password.</p>
          </div>
        </div>

        <div class="fp-divider">OR</div>
        <a href="index.html" class="fp-back-link">Back to Login</a>

      </div>
    </div>
  </main>

  <script>
    document.getElementById('resetForm').addEventListener('submit', function (e) {
      e.preventDefault();

      var errorEl = document.getElementById('resetPasswordError');
      var submitBtn = document.getElementById('submitBtn');
      errorEl.textContent = '';

      var newPassword = document.getElementById('newPassword').value;
      var confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters.';
        return;
      }
      if (newPassword !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match.';
        return;
      }

      submitBtn.disabled = true;

      fetch('php/forgot-password.php?action=reset_password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          new_password: newPassword,
          confirm_password: confirmPassword
        })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (result.success) {
            sessionStorage.removeItem('resetEmail');
            document.getElementById('successBox').classList.add('show');
            setTimeout(function () {
              window.location.href = 'index.html';
            }, 2000);
          } else {
            errorEl.textContent = result.message || 'Could not reset password. Please try again.';
            submitBtn.disabled = false;
          }
        })
        .catch(function () {
          errorEl.textContent = 'Unable to reach the server. Please try again.';
          submitBtn.disabled = false;
        });
    });
</script>
<script>
  document.querySelectorAll('.fp-eye-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.getAttribute('data-target'));
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.classList.toggle('is-visible', show);
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  });
</script>
</body>
</html>
